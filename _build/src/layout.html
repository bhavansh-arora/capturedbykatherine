<head>

<body class="page-{{page}} theme-{{theme}} {{bodyClass}}" data-page="{{page}}">

  </div>
  <script>setTimeout(function(){if(!window.CBK_READY){var c=document.querySelector('.curtain');c&&c.classList.add('is-out')}},2500)</script>
  <div class="grain" aria-hidden="true"></div>
  <div class="cursor" aria-hidden="true"><span class="cursor__label"></span></div>
{{header}}

{{content}}
  </main>
