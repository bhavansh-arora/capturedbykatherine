<body class="page-{{page}} theme-{{theme}} {{bodyClass}}" data-page="{{page}}">

      <p class="loader__tag"><span>Candid</span><i></i><span>Relaxed</span><i></i><span>Thoughtful</span></p>
      <p class="loader__page"><span></span></p>
    </div>
    <div class="loader__foot">
      <div class="loader__count"><span>Developing</span><b>00</b></div>
      <span class="loader__where">Brisbane, Queensland</span>
    </div>
    <i class="loader__bar"><i></i></i>
    <i class="loader__ring"></i>
    <i class="loader__flash"></i>
  </div>
  <script>(function(){var l=document.querySelector('.loader'),m='mode-plain';try{var n=sessionStorage.getItem('cbk-nav');if(n){m='mode-nav';l.querySelector('.loader__page span').textContent=n;sessionStorage.removeItem('cbk-nav')}else if(!sessionStorage.getItem('cbk-seen')){m='mode-intro'}}catch(e){}l.className='loader '+m;setTimeout(function(){if(!window.CBK_READY)l.classList.add('is-gone')},4500)})()</script>
